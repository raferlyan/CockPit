name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 已存在且校验和一致时跳过下载
      - run: npm run fetch-server

      - run: npm run typecheck

      - run: npm test

      # 只产出未打包的目录，签名与安装包在发布流程中再做
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-${{ matrix.os }}
          path: release/*-unpacked/**, release/mac*/**
          if-no-files-found: ignore
